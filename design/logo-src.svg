<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-labelledby="dmTitle">
  <title id="dmTitle">Divine Melodies</title>
  <defs>
    <style>
/*FONTS*/
      .arc  { font-family: 'Cinzel', Georgia, serif; font-weight: 600; font-size: 26.5px; letter-spacing: 1.2px; fill: #f7efd9; }
      .ref  { font-family: 'Cinzel', Georgia, serif; font-weight: 700; font-size: 23px; letter-spacing: 3px; fill: #e9c979; }
      .div  { font-family: 'Cinzel', Georgia, serif; font-weight: 700; font-size: 42px; letter-spacing: 18px; fill: #f7efd9; }
      .mel  { font-family: 'Cinzel Decorative', 'Cinzel', Georgia, serif; font-weight: 700; font-size: 80px; letter-spacing: 3px; }
    </style>
    <radialGradient id="disc" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#26307a"/>
      <stop offset="0.55" stop-color="#161d52"/>
      <stop offset="1" stop-color="#0a0e2c"/>
    </radialGradient>
    <radialGradient id="medallion" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#2d3890"/>
      <stop offset="1" stop-color="#121848"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#ffd98a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="0.35" stop-color="#f0c96a"/>
      <stop offset="0.7" stop-color="#c8913a"/>
      <stop offset="1" stop-color="#f3d488"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8913a"/>
      <stop offset="0.5" stop-color="#fff1c4"/>
      <stop offset="1" stop-color="#c8913a"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#eadfc4"/>
    </linearGradient>
    <!-- 280° arc over the top, starting lower-left -->
    <path id="topArc" d="M 199.7 752 A 392 392 0 1 1 800.3 752"/>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer disc and rings -->
  <circle cx="500" cy="500" r="496" fill="url(#disc)"/>
  <circle cx="500" cy="500" r="478" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="500" cy="500" r="466" fill="none" stroke="#e9c979" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Scripture band -->
  <text class="arc"><textPath href="#topArc" startOffset="50%" text-anchor="middle">…AND SING PSALMS AND HYMNS AND SPIRITUAL SONGS WITH THANKFULNESS IN YOUR HEARTS TO GOD.</textPath></text>
  <!-- Bottom ornament -->
  <g fill="#e9c979" transform="translate(500 906)">
    <path d="M 0 -13 C 2 -4, 4 -2, 13 0 C 4 2, 2 4, 0 13 C -2 4, -4 2, -13 0 C -4 -2, -2 -4, 0 -13 Z"/>
    <circle cx="-34" cy="0" r="3.5"/>
    <circle cx="34" cy="0" r="3.5"/>
  </g>

  <!-- Inner medallion -->
  <circle cx="500" cy="500" r="366" fill="url(#medallion)"/>
  <circle cx="500" cy="500" r="366" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="500" cy="500" r="354" fill="none" stroke="#e9c979" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="500" cy="420" r="230" fill="url(#halo)"/>

  <!-- Reference with star emblems -->
  <g transform="translate(318 218)" fill="#e9c979">
    <!-- five-point star -->
    <polygon points="0,-14 4.1,-4.3 14.3,-4.3 6.1,2.1 8.8,12.3 0,6.3 -8.8,12.3 -6.1,2.1 -14.3,-4.3 -4.1,-4.3"/>
  </g>
  <text class="ref" x="501.5" y="226" text-anchor="middle">COLOSSIANS 3:16</text>
  <g transform="translate(682 216)" fill="none" stroke="#e9c979" stroke-width="2.6" stroke-linejoin="round">
    <!-- Star of David -->
    <polygon points="0,-15 13,7.5 -13,7.5"/>
    <polygon points="0,15 13,-7.5 -13,-7.5"/>
  </g>

  <!-- Lyre -->
  <g filter="url(#soft)">
    <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
      <!-- arms -->
      <path stroke-width="24" d="M 470 548 C 385 535, 342 468, 360 382 C 371 328, 382 300, 352 276 C 331 260, 306 272, 315 294"/>
      <path stroke-width="24" d="M 530 548 C 615 535, 658 468, 640 382 C 629 328, 618 300, 648 276 C 669 260, 694 272, 685 294"/>
      <!-- crossbar -->
      <path stroke-width="13" d="M 372 318 Q 500 296 628 318"/>
    </g>
    <!-- strings -->
    <g stroke="#fff6dc" stroke-width="3.2" stroke-linecap="round">
      <line x1="446" y1="312" x2="452" y2="540"/>
      <line x1="473" y1="309" x2="476" y2="540"/>
      <line x1="500" y1="308" x2="500" y2="540"/>
      <line x1="527" y1="309" x2="524" y2="540"/>
      <line x1="554" y1="312" x2="548" y2="540"/>
    </g>
    <!-- tuning pegs -->
    <g fill="url(#goldH)" stroke="#8a6122" stroke-width="1">
      <circle cx="446" cy="294" r="8"/>
      <circle cx="473" cy="290" r="8"/>
      <circle cx="500" cy="288" r="9"/>
      <circle cx="527" cy="290" r="8"/>
      <circle cx="554" cy="294" r="8"/>
    </g>
    <!-- base -->
    <rect x="428" y="536" width="144" height="22" rx="11" fill="url(#goldH)"/>

    <!-- Open book -->
    <g stroke="#b9853a" stroke-width="2.5" stroke-linejoin="round">
      <path fill="url(#page)" d="M 500 584 C 468 568, 432 566, 402 574 L 402 622 C 432 614, 468 616, 500 632 Z"/>
      <path fill="url(#page)" d="M 500 584 C 532 568, 568 566, 598 574 L 598 622 C 568 614, 532 616, 500 632 Z"/>
    </g>
    <g stroke="#c9a56a" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
      <path fill="none" d="M 418 586 C 440 580, 462 582, 486 592"/>
      <path fill="none" d="M 418 598 C 440 592, 462 594, 486 604"/>
      <path fill="none" d="M 418 610 C 440 604, 462 606, 486 616"/>
      <path fill="none" d="M 582 586 C 560 580, 538 582, 514 592"/>
      <path fill="none" d="M 582 598 C 560 592, 538 594, 514 604"/>
      <path fill="none" d="M 582 610 C 560 604, 538 606, 514 616"/>
    </g>
  </g>

  <!-- Floating notes -->
  <g fill="#e9c979" opacity="0.85">
    <g transform="translate(256 430) rotate(-12)">
      <ellipse cx="0" cy="0" rx="11" ry="8" transform="rotate(-20)"/>
      <rect x="8" y="-44" width="3.5" height="44"/>
      <path d="M 11.5 -44 C 24 -38, 30 -28, 24 -16 C 26 -26, 20 -32, 11.5 -34 Z"/>
    </g>
    <g transform="translate(724 452) rotate(10)">
      <ellipse cx="0" cy="0" rx="10" ry="7.5" transform="rotate(-20)"/>
      <ellipse cx="30" cy="-8" rx="10" ry="7.5" transform="rotate(-20 30 -8)"/>
      <rect x="7.5" y="-42" width="3.2" height="42"/>
      <rect x="37.5" y="-50" width="3.2" height="42"/>
      <polygon points="7.5,-42 40.7,-50 40.7,-42 7.5,-34"/>
    </g>
  </g>

  <!-- Name -->
  <text class="div" x="509" y="690" text-anchor="middle">DIVINE</text>
  <text class="mel" x="500" y="772" text-anchor="middle" fill="url(#gold)" stroke="#8a6122" stroke-width="0.8">MELODIES</text>
  <path d="M 380 800 L 620 800" stroke="url(#goldH)" stroke-width="2"/>
</svg>
